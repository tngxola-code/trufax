# Trufax quality gate registry.
#
# Each gate is declared here. Gate implementations live in gates/impl/.
# Gate branches append to this file, one gate per branch.
#
# Stages:
#   commit        — runs on every push
#   pull-request  — runs on every PR
#   deploy        — runs before production deploy
#
# A gate that does not block promotion is not a gate.

version: 1
gates:
  - id: QG-1
    name: lint
    stage: commit
    blocking: true
    impl: gates.impl.lint:LintGate
    timeout_seconds: 120
    description: "ruff check, ruff format --check, mypy on gates/"

  - id: QG-3
    name: security-scan
    stage: pull-request
    blocking: true
    impl: gates.impl.security:SecurityGate
    timeout_seconds: 300
    description: "pip-audit, bandit, detect-secrets on gates/ and src/"
