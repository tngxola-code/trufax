[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qc-property"
version = "0.1.0"
description = "Québec City property assessment roll extractor"
readme = "README.md"
authors = [
    {name = "Your Name", email = "you@example.com"}
]
license = {text = "MIT"}
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.25.0",
    "lxml>=4.9.0",
    "pydantic>=2.0.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "tenacity>=8.2.0",
    "PyYAML>=6.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
]
[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.1.0", "pytest-cov", "mypy>=1.10", "types-PyYAML"]

[project.scripts]
qc-property = "qc_property.cli:main"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]