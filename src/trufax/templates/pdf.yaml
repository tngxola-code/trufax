job: __JOB__
client: ""
description: "What this dataset is and who it is for."

source:
  type: pdf
  start_urls:
    - documents/report.pdf      # local path or https:// URL
  pdf:
    mode: table                 # "text" + row_regex for PDFs without ruled tables
    pages: "1-5"
    header_row: 0
    skip_rows_matching: ["^Source:"]
    totals:                     # printed totals become reconciliation checks
      - label_field: item
        label_regex: "(?i)^total"
        sum_fields: [amount]
  fields:
    item: { src: "Item" }                        # column header in the table
    amount: { src: "Amount", type: decimal, transforms: [strip_currency] }

validation:
  required: [item, amount]

output:
  formats: [csv, xlsx]
