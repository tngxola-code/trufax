name: Quality Gates

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  commit:
    name: Commit stage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]" || pip install -e .
      - name: Run commit stage
        run: ./scripts/run-gates.sh commit

  pull-request:
    name: Pull request stage
    runs-on: ubuntu-latest
    needs: commit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]" || pip install -e .
      - name: Run PR stage
        run: ./scripts/run-gates.sh pull-request

  deploy:
    name: Deploy stage
    runs-on: ubuntu-latest
    needs: pull-request
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]" || pip install -e .
      - name: Run deploy stage
        run: ./scripts/run-gates.sh deploy
